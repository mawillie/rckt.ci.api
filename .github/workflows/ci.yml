name: CI

# trigger
on:
  push:
    branches:
      - main

jobs:
  build:
    name: "Build and Push"
    runs-on: ubuntu-latest
    # strategy:
    #   matrix:
    #     node: [22]

    steps:
      - uses: actions/checkout@v7

      - name: Setup node | ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          # node-version: ${{ matrix.node }}
          node-version: 22
          cache: "yarn"
      - run: yarn
      - run: yarn run test

      # Pega os 7 primeiros caracteres do hash do commit.
      - name: Generate tag
        id: generate_tag
        run: |
          SHA=$(echo $GITHUB_SHA | head -c7)
          echo "Sha=$SHA" >> $GITHUB_OUTPUT

      - name: Login into the container registry
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: mawilee/rocketseat-ci-api:${{ steps.generate_tag.outputs.sha }},mawilee/rocketseat-ci-api:latest

      # - name: Build docker image
      #   run: docker build -t mawilee/rocketseat-ci-api:${{ steps.generate_tag.outputs.sha }} .

      # - name: Push image
      #   run: docker push mawilee/rocketseat-ci-api:${{ steps.generate_tag.outputs.sha }}
